spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/crm_db
    username: crm_user
    password: crm_password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    # Сессия Hibernate открывается в сервисе/репозитории, уже после определения организации
    # из токена. Это важно для изоляции данных (@TenantId) и TenantContext.callAs.
    open-in-view: false

server:
  # Доверять X-Forwarded-For только от внутреннего прокси (nginx) — для IP в журнале входов
  forward-headers-strategy: native

springdoc:
  swagger-ui:
    urls-primary-name: Школа
    persist-authorization: true   # токен из «Authorize» сохраняется при перезагрузке страницы
    operations-sorter: method

crm:
  security:
    # Ключ подписи JWT, не короче 32 символов. В production задаётся обязательно.
    jwt-secret: ${CRM_JWT_SECRET:}
    token-ttl: 12h
    # Первый суперадминистратор (создаётся при запуске, если их ещё нет)
    bootstrap-admin:
      email: ${CRM_ADMIN_EMAIL:}
      password: ${CRM_ADMIN_PASSWORD:}
      full-name: ${CRM_ADMIN_NAME:}
